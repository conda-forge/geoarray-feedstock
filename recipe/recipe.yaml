schema_version: 1

context:
  name: geoarray
  version: "0.20.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 3a270ce7468267e84036414c324efbccead565948b29173cfb88a8c33b02f646

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
  host:
    - pip
    - python
    - setuptools
    - setuptools-git
  run:
    - cartopy >=0.20
    - dill
    - gdal >=3.8.0
    - matplotlib-base
    - numpy
    - pandas
    - py-tools-ds >=0.19.0
    - python
    - scikit-image
    - shapely

tests:
  - python:
      imports:
        - geoarray
        - geoarray.baseclasses
        - geoarray.masks
        - geoarray.metadata
        - geoarray.subsetting
      pip_check: true

about:
  summary: Fast Python interface for geodata - either on disk or in memory.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/geoarray/

extra:
  recipe-maintainers:
    - mxr-conda
    - danschef
    - rluria14
    - ndmaxar
    - RyanHackney
